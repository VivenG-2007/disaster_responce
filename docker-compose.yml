services:
  # 🏢 COMMAND DASHBOARD - Tactical Frontend
  frontend:
    build:
      context: ./next-app
      dockerfile: Dockerfile
    container_name: sector7-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:5000
    networks:
      - tactical-net

  # 🛰️ HYBRID GATEWAY - Node.js Tactical API
  backend-node:
    build:
      context: ./backend/node
      dockerfile: Dockerfile
    container_name: sector7-node-gateway
    ports:
      - "5000:5000"
    environment:
      - NODE_PORT=5000
      - PYTHON_AI_URL=http://backend-python:8000/api/analyze
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}
      - ELASTICSEARCH_URL=http://elasticsearch:9200
    depends_on:
      - backend-python
      - elasticsearch
    networks:
      - tactical-net

  # 🌪️ NEURAL CORE - Python Gemini AI
  backend-python:
    build:
      context: ./backend/python
      dockerfile: Dockerfile
    container_name: sector7-python-ai
    ports:
      - "8000:8000"
    environment:
      - GCP_PROJECT_ID=${GCP_PROJECT_ID}
    networks:
      - tactical-net

  # 🏎️ TACTICAL SIMULATOR - GPS GPS Movement
  simulation:
    build:
      context: .
      dockerfile: scripts/Dockerfile.sim # I'll create this
    container_name: sector7-simulator
    environment:
      - FIREBASE_DATABASE_URL=${FIREBASE_DATABASE_URL}
    networks:
      - tactical-net

  # 📊 ELASTICSEARCH - Search & Analytical Engine
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.1
    container_name: sector7-elastic
    environment:
      - node.name=sector7-node
      - cluster.name=sector7-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false 
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    networks:
      - tactical-net
    volumes:
      - es_data:/usr/share/elasticsearch/data

  # 📈 KIBANA - Visual Analytics Dashboard
  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.1
    container_name: sector7-kibana
    depends_on:
      - elasticsearch
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - tactical-net

  # 🔄 n8n - Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: sector7-n8n
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - tactical-net

networks:
  tactical-net:
    driver: bridge

volumes:
  es_data:
    driver: local
  n8n_data:
    driver: local

